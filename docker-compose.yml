# Not yet runnable: Docker Desktop is not installed on the dev machine.
# Each service also runs standalone without Docker: see "Run the web app locally" in README.md.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  model-service:
    build:
      context: .                      # needs ml/src and ml/models/final
      dockerfile: model-service/Dockerfile
    ports: ["8000:8000"]

  backend:
    build: ./backend
    ports: ["4000:4000"]
    env_file: .env
    environment:
      MODEL_SERVICE_URL: http://model-service:8000
      MONGODB_URI: mongodb://mongo:27017/captionscore
    depends_on: [mongo, model-service]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000   # the browser calls the backend directly
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  mongo-data:
