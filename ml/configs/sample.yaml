# Phase 1 sampling config. See docs/data_notes.md for why these values were chosen.
repo_id: datasocial/tiktok-5.6B-videos
start_month: "2022-01"
end_month: "2026-08"          # inclusive
language: en                  # v1 is English only
rows_per_month: 15000         # target cleaned rows per month
row_groups_per_month: 6       # random row groups read per monthly file (spread across the file)
seed: 42
max_download_gb: 2.0          # sampling script refuses to run above this without --confirm
columns:                      # only these are read (column projection keeps downloads small)
  - video_id
  - posted_at
  - country
  - language
  - type
  - duration_ms
  - width
  - height
  - caption
  - hashtags
  - sound_id
  - is_ad
  - branded_content
  - is_ai_generated
  - not_recommended_for_fyp
  - views
  - likes
  - comments
  - shares
  - saves
  - stats_updated_at
output: ml/data/sample_en_2022-01_2026-08.parquet
