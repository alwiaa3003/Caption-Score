<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Score a short-video caption: how likely is it to reach the top 10% of comparable posts?"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CaptionScore</title>
    <script>
      // Apply the saved theme before first paint (light unless the visitor chose dark).
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('captionscore-theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
